<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Centro Eonia</title><link rel="stylesheet" href="style.css"></head><body><header><b>CENTRO EONIA</b><span>Centro de aplicaciones</span></header><main>
<section id="home" class="screen"><h1>Centro de aplicaciones</h1><div class="grid"><button onclick="go('football')">⚽<small>Fútbol</small></button><button>📖<small>Pokédex</small></button><button>🎮<small>Juegos</small></button><button>📝<small>Notas</small></button><button>🧮<small>Herramientas</small></button><button>⚙️<small>Configuración</small></button></div></section>
<section id="football" class="screen hidden"><button class="back" onclick="go('home')">← Volver</button><h1>⚽ Fútbol</h1><div class="grid three"><button onclick="go('players')">👤<small>Jugadores</small></button><button onclick="go('teams')">🛡️<small>Equipos</small></button><button onclick="go('coaches')">👔<small>Entrenadores</small></button></div></section>
<section id="players" class="screen hidden"><button class="back" onclick="go('football')">← Fútbol</button><h1>👤 Jugadores</h1><div class="tools"><input id="pq" placeholder="🔍 Buscar jugador" oninput="players()"><select id="pp" onchange="players()"><option value="">Todas las posiciones</option><option>POR</option><option>DEF</option><option>MED</option><option>ATA</option></select><button onclick="newPlayer()">➕ Crear</button></div><div id="pl"></div></section>
<section id="teams" class="screen hidden"><button class="back" onclick="go('football')">← Fútbol</button><h1>🛡️ Equipos</h1><div class="tools"><input id="tq" placeholder="🔍 Buscar equipo" oninput="teams()"><button onclick="newTeam()">➕ Crear</button></div><div id="tl"></div></section>
<section id="coaches" class="screen hidden"><button class="back" onclick="go('football')">← Fútbol</button><h1>👔 Entrenadores</h1><div class="tools"><input id="cq" placeholder="🔍 Buscar entrenador" oninput="coaches()"><button onclick="newCoach()">➕ Crear</button></div><div id="cl"></div></section>
</main><script src="app.js"></script></body></html>
<!-- Centro Eonia -->
